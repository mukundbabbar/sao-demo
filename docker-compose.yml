services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 10

  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vectordb
      WAIT_FOR_POSTGRES: "1"
    volumes:
      # Copy .streamlit/secrets.toml.template -> secrets.toml and fill in keys first.
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Banking REST API (same image, different command). Enable with: docker compose --profile api up api
  api:
    profiles: ["api"]
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vectordb
      WAIT_FOR_POSTGRES: "1"
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]

volumes:
  pgdata:
